name: 问题反馈
description: 报告一个 Bug 或异常问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！请尽量完整地填写下面的内容，方便我们快速定位问题。

  - type: textarea
    id: summary
    attributes:
      label: 问题简述
      description: 用一两句话概括你遇到的问题。
      placeholder: 例如：播放本地音频时进度条不跟随滚动。
    validations:
      required: true

  # 版本号下拉：options 由 .github/workflows/refresh-issue-versions.yml 在
  # Release 发布时自动重建（取自本仓 v* tag，倒序）。手工增删版本请只改标记区间内的行，
  # 或直接不发这个下拉的自动更新。「其他（手动填写）」永远排在最后，脚本不碰。
  - type: dropdown
    id: version
    attributes:
      label: 版本号
      description: 选择你实际使用的版本（Tag）。如果列表中没有对应版本，请选择「其他（手动填写）」，并在下一项补充。
      options:
        # >>> auto-generated-options (refresh-issue-versions 维护，勿手改) >>>
        - v1.4.1
        - v1.4.0-beta.3
        - v1.4.0-beta.2
        - v1.4.0-beta.1
        - v1.4.0
        - v1.3.5
        - v1.3.4
        - v1.3.3
        - v1.3.2
        - v1.3.1
        - v1.3.0-Evanescia-TyphoeusGo-Early-Alpha-loong-aosc
        - v1.3.0-Evanescia-TyphoeusGo-Early-Alpha
        - v1.3.0-Ellen-Evanescia-TyphoeusGo-Early-Alpha-260930
        - v1.3.0
        - v1.2.3
        - v1.2.2
        - v1.2.1
        - v1.2.0
        - v1.1.2
        - v1.1.1
        - v1.1.0-smtc-nowplay-test
        - v1.1.0-smtc
        - v1.1.0-plugins-test
        - v1.1.0-ellen-cyrene-dynamic-lyrics-test
        - v1.1.0-ellen-cyrene-cross-test
        - v1.1.0-ellen-cyrene-cp-test
        - v1.1.0
        - v1.0.6
        - v1.0.5
        - v1.0.4
        - v1.0.3
        - v1.0.2
        - v1.0.1
        - v1.0.0-rc
        - v1.0.0-firstlook-alpha1
        - v1.0.0-ellen-chisa-alpha3
        - v1.0.0-ellen-chisa-alpha2-2
        - v1.0.0-ellen-chisa-alpha2-1
        - v1.0.0-ellen-chisa-alpha2
        - v1.0.0-beta
        - v1.0.0-alpha-3
        - v0.1.1
        - v0.1.0
        - v0.0.4
        - v0.0.3
        - v0.0.2
        - v0.0.1
        # <<< auto-generated-options <<<
        - 其他（手动填写）
    validations:
      required: true

  - type: input
    id: version_manual
    attributes:
      label: 手动填写版本号
      description: 仅当上方选择「其他（手动填写）」时填写，其它情况留空。
      placeholder: 例如：v1.4.0-beta.4 或 commit hash
    validations:
      required: false

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: 重复检查
      options:
        - label: 我已搜索现有 Issue，确认该问题未被重复报告。
          required: true
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现过程
      description: 描述复现该问题的具体步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: false

  - type: textarea
    id: result
    attributes:
      label: 复现结果
      description: 实际发生了什么（实际表现）。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 理想结果
      description: 你期望发生什么。
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 其他补充信息，例如日志、截图、系统环境等。
    validations:
      required: false
