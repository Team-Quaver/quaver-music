# Quaver — 版本号三态解析（所有前端打包 job 共用）。
#   打 v* tag  → tag 去掉 v
#   每夜版     → <package.json 版本>-<短 sha>-nightly
#   其余       → package.json 里的版本
# 必须在 vite build 之前解析：vite.config.ts 把它注入 __APP_VERSION__（关于页），
# 否则浅克隆下 git describe 拿不到 tag，关于页永远显示 package.json 里的 0.0.1。
#
# 版本号为什么不是纯 `commit id + nightly`：electron-builder 会跑 normalizePackageData，
# 非 semver 直接 `throw new Error('Invalid version: ...')`，所以 commit id 只能待在
# prerelease 段里。同理不能用 `0.0.1-nightly+<sha>` —— semver.clean() 会把 build metadata
# （`+` 后面）抹掉，版本最后只剩 `0.0.1-nightly`，commit id 白写。
#
# 三个分支都输出具体版本号（空值分支回退 package.json 版本）：产物文件名
# （Quaver-<version>-<arch>）与 --config.extraMetadata.version 全部用同一个输出，
# 不再依赖「留空让 builder 自己取」——那是 Linux AppImage 时代的老口径。
name: Resolve Quaver version
inputs:
  nightly:
    description: 按每夜版解析（版本号带短 commit id）
    type: boolean
    default: false
outputs:
  version:
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        NIGHTLY: ${{ inputs.nightly }}
      run: |
        set -euo pipefail
        # 本地 action 只能在本仓内引用，GITHUB_WORKSPACE 即仓库根 —— ui/ 的定位走它。
        # 别用 $GITHUB_ACTION_PATH 数层级：从 resolve-version/ 上两级只到 .github/ 而非
        # 仓库根（少算一级），拼出 <repo>/.github/ui 直接 MODULE_NOT_FOUND —— tag 构建
        # 走 elif 短路碰不到 require，绿灯 run 一直掩盖着这条只有 push/nightly 才踩的雷。
        ui_dir="$GITHUB_WORKSPACE/ui"
        if [[ "$NIGHTLY" == "true" ]]; then
          base=$(node -p "require('$ui_dir/package.json').version")
          sha="${GITHUB_SHA:0:7}"
          echo "version=${base}-${sha}-nightly" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        else
          # GITHUB_OUTPUT 每行必须是 name=value —— 裸值会让 runner 报 Invalid format。
          # （这行此前从未跑通过：先被 ui_dir 的层级 bug 挡在 require，格式错误是修完才露出来的。）
          echo "version=$(node -p "require('$ui_dir/package.json').version")" >> "$GITHUB_OUTPUT"
        fi
        echo "resolved: $(tail -1 "$GITHUB_OUTPUT")"
