# Quaver — 版本号三态解析（所有前端打包 job 共用）。
#   打 v* tag  → tag 去掉 v（含 beta tag，如 v1.5.0-beta.1 → 1.5.0-beta.1，prerelease 段自带 beta）
#   每夜版     → <package.json 版本>-<短 sha>-nightly
#   其余       → package.json 里的版本
# 必须在 vite build 之前解析：vite.config.ts 把它注入 __APP_VERSION__（关于页），
# 否则浅克隆下 git describe 拿不到 tag，关于页永远显示 package.json 里的 0.0.1。
#
# 版本号为什么不是纯 `commit id + nightly`：electron-builder 会跑 normalizePackageData，
# 非 semver 直接 `throw new Error('Invalid version: ...')`，所以 commit id 只能待在
# prerelease 段里。同理不能用 `0.0.1-nightly+<sha>` —— semver.clean() 会把 build metadata
# （`+` 后面）抹掉，版本最后只剩 `0.0.1-nightly`，commit id 白写。
#
# 三个分支都输出具体版本号（空值分支回退 package.json 版本）：产物文件名
# （Quaver-<version>-<arch>）与 --config.extraMetadata.version 全部用同一个输出，
# 不再依赖「留空让 builder 自己取」——那是 Linux AppImage 时代的老口径。
name: Resolve Quaver version
description: 解析 tag / nightly / package.json 的客户端版本号
inputs:
  nightly:
    description: 按每夜版解析（版本号带短 commit id）
    type: boolean
    default: false
outputs:
  version:
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        NIGHTLY: ${{ inputs.nightly }}
      run: |
        set -euo pipefail
        # 本地 action 只能在本仓内引用，GITHUB_WORKSPACE 即仓库根 —— ui/ 的定位走它。
        # 别用 $GITHUB_ACTION_PATH 数层级：从 resolve-version/ 上两级只到 .github/ 而非
        # 仓库根（少算一级），拼出 <repo>/.github/ui 直接 MODULE_NOT_FOUND —— tag 构建
        # 走 elif 短路碰不到 require，绿灯 run 一直掩盖着这条只有 push/nightly 才踩的雷。
        # Windows runner 的 GITHUB_WORKSPACE 带反斜杠（D:\a\<owner>\<repo>），原样拼进下面的
        # node -p "require('...')" 会被 JS 字符串当转义序列吃掉（\a、\q 非法转义 → 静默丢
        # 反斜杠），变成 D:a<owner><repo>/ui/... MODULE_NOT_FOUND —— nightly 的 Windows job
        # 专属雷，Linux/macOS 路径无反斜杠不炸。统一转正斜杠：Windows node 认 D:/a/...，
        # 其余平台不含反斜杠，等于无操作。
        ui_dir="${GITHUB_WORKSPACE//\\//}/ui"
        if [[ "$NIGHTLY" == "true" ]]; then
          base=$(node -p "require('$ui_dir/package.json').version")
          sha="${GITHUB_SHA:0:7}"
          version="${base}-${sha}-nightly"
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF#refs/tags/v}"
        else
          version=$(node -p "require('$ui_dir/package.json').version")
        fi

        # 早拦：版本串必须落在 semver 的字符集里（数字/字母/`.`/`-`）。
        # 只报错、不归一化 —— 同一个串在别处的解释权不在我们手上，替换掉字符只会把雷埋深：
        #   - deb：Debian 的 Version 只认 [A-Za-z0-9.+~-]，带 `_` 会被 fpm 拒，而且要等
        #     fpm 把整棵树复制完才报（几十分钟的 runner 白烧），报错信息还埋在 cmake 般的堆栈里；
        #   - 客户端：ui/src/lib/update-core.ts 的 parseVersion 正则要求 prerelease 前是 `-`，
        #     `v1.4.5_beta.1` 这类 tag 直接解析成 null → Beta 渠道整条 release 被静默忽略；
        #   - semver 本身：prerelease 段只允许 [0-9A-Za-z-]（`_` 不在内）。
        # 这里顺手把 `_` 换成 `-` 看着能救急，但 git tag 仍是 `_`，客户端照样认不出 ——
        # 那就成了一条能下载、却永远不会被提示的哑火 release。
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          printf '::error::解析出的版本 "%s" 不是合法 semver：只允许 [0-9A-Za-z.-]，prerelease 前必须是 "-"。\n' "$version"
          printf '::error::多半是把 tag 里的 "-" 写成了 "_"（如 v1.4.5_beta.1）—— 请改成 v1.4.5-beta.1 重新打 tag。\n'
          exit 1
        fi

        # GITHUB_OUTPUT 每行必须是 name=value —— 裸值会让 runner 报 Invalid format。
        # （这行此前从未跑通过：先被 ui_dir 的层级 bug 挡在 require，格式错误是修完才露出来的。）
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "resolved: $version"
