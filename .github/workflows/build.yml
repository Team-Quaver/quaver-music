# Quaver — 全平台打包 CI
#
# 后端：vendor/Typhoeus (quaver_server FastAPI sidecar) → PyInstaller onefile 二进制
# 前端：ui (Electron + Vite) → 平台安装包（随包对应架构的 sidecar 与音频运行时 mpv）
#
# 目标平台：
#   linux    x86_64 + aarch64 → AppImage（原生 runner，PyInstaller 不能交叉编译）
#   windows  x64 + arm64      → NSIS（sidecar 跑原生 arm runner；前端都在 x64 上交叉打包）
#   macos    arm64 → dmg（x86 构建已裁撤：universal 合并要求包内所有 Mach-O 双架构，
#            与 cryptography 无 intel macOS wheel、mpv 两包结构不对称一起构成死局）
#   linux    loongarch64（龙芯 ABI 2.0）→ tar.gz（无 electron-builder 支持 → dir 包换 Electron）
#
# 上游口径（别想当然）：
#   - mpv 官方 release 只发 Windows + macOS 二进制：Windows 用 mingw x64（自带全套 DLL）+
#     msvc arm64（静态链接）；macOS 用 macos-15 arm 单份 zip（自包含 mpv.app）。Linux 用
#     pkgforge AppImage（x86_64/aarch64），loongarch64 无预编译 mpv → **不随包**，
#     运行期回落系统 mpv / <audio>。
#   - Electron 官方没有 loong64 发行版；loongnix 的新版只到 v31.7.7
#     （https://ftp.loongnix.cn/electron/LoongArch/v31.7.7/）。主仓开发用 Electron 44 →
#     loong64 包用 31.7.7 的二进制 + 同一份 app 资源（asar/DLL 无关架构），运行期兼容性
#     无法在 CI 验证，属已知风险。
#   - PyPI 没有 loong64 wheel 的三个 Rust 包（cryptography / pydantic-core / orjson）从
#     loong64 社区镜像取预编译：https://mirrors.loong64.com/pypi/simple（cryptography 47+、
#     pydantic-core 2.41+、orjson 3.12 均有 cp311 wheel，与 uv.lock 版本对齐）。
#   - windows-11-arm 上 **sidecar 是 x64 二进制**（cryptography 无 win-arm64 wheel，
#     原生构建不现实）→ 钉 x64 Python，靠 Windows on ARM 的 x64 模拟跑；Electron 原生 arm64。
#
# 触发：
#   - push 到 main / PR：只出 artifact
#   - 打 v* tag：额外创建正式 GitHub Release 的**草稿**（版本号 = tag 去掉 v），
#     人工检查产物后手动 Publish
#   - 每夜定时 / 手动勾 nightly：版本号 = <package.json 版本>-<短 commit id>-nightly，
#     发布到滚动 Release「nightly」（覆盖昨天的）
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # 每天 18:00 UTC（北京时间次日 02:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: 按每夜版构建（版本号带 commit id，并发布/覆盖滚动 Release「nightly」）
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────── 后端（sidecar） ──────────────────────────────
jobs:
  sidecar-linux:
    name: sidecar linux (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86_64
            runs_on: ubuntu-24.04
          - arch_label: aarch64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # sidecar 在 vendor/Typhoeus（本仓 submodule）内构建，仅需 QQMusicApi（SDK）path 依赖
      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/QQMusicApi
          git submodule update --init --depth 1 vendor/Typhoeus

      - uses: astral-sh/setup-uv@v10.1.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # 与本地 uv.lock 生成环境一致（3.11/3.12 均满足 >=3.11,<3.14）

      - name: Install deps
        working-directory: vendor/Typhoeus
        run: uv sync --frozen --no-dev

      - name: PyInstaller onefile
        working-directory: vendor/Typhoeus
        run: |
          uv run --frozen --with pyinstaller --with pyinstaller-hooks-contrib \
            pyinstaller --clean --noconfirm --onefile \
              --name quaver-server \
              --distpath dist-bin --workpath build/pyi --specpath build/pyi \
              --hidden-import uvicorn.logging \
              --hidden-import uvicorn.loops.auto \
              --hidden-import uvicorn.loops.asyncio \
              --hidden-import uvicorn.protocols.http.auto \
              --hidden-import uvicorn.protocols.http.h11_impl \
              --hidden-import uvicorn.protocols.websockets.auto \
              --hidden-import uvicorn.protocols.websockets.wsproto_impl \
              --hidden-import uvicorn.protocols.websockets.websockets_impl \
              --hidden-import python_socks \
              --copy-metadata qqmusic-api-python \
              build_entry.py

      - name: Smoke test binary
        working-directory: vendor/Typhoeus
        run: |
          mkdir -p "$HOME/.config/quaver"   # 无凭证文件也须能起（返回未登录）
          QUAVER_PORT=3999 ./dist-bin/quaver-server > /tmp/sidecar-ci.log 2>&1 &
          SERVER_PID=$!
          status=1
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS --max-time 3 http://127.0.0.1:3999/login/status >/dev/null 2>&1; then
              echo "sidecar OK"; status=0; break
            fi
          done
          kill $SERVER_PID 2>/dev/null
          [ "$status" = 0 ] || cat /tmp/sidecar-ci.log
          exit $status

      - name: Rename for artifact
        working-directory: vendor/Typhoeus
        run: cp dist-bin/quaver-server dist-bin/quaver-server-$(uname -m)

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-linux-${{ matrix.arch_label }}
          path: vendor/Typhoeus/dist-bin/quaver-server-${{ matrix.arch_label }}

  # Windows：PyInstaller 不能交叉编译 → 两档各自跑。
  # 注意全 job 的 run 步骤一律 shell: bash：默认 PowerShell 不认 `\` 续行。
  # arm64 的口径：**sidecar 是 x64 二进制**，靠 Windows on ARM 的 x64 模拟跑 ——
  # 依赖链上的 cryptography 连上游都不发 win-arm64 wheel（PyPI 50.0.1 实测只有
  # win_amd64），原生构建要自拖 OpenSSL+Rust 工具链，不值得；整个生态在 WoA 上
  # 就是模拟跑 x64 的。arm64 runner 上显式钉 3.11-x86_64（uv 默认恰好也是它，
  # 但别依赖默认值）。Electron 本体仍是原生 arm64。
  sidecar-windows:
    name: sidecar windows (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x64
            runs_on: windows-latest
            py_request: "3.11"
          - arch_label: arm64
            runs_on: windows-11-arm
            py_request: "3.11-x86_64"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 vendor/QQMusicApi
          git submodule update --init --depth 1 vendor/Typhoeus

      # 不用 setup-python：python-versions 的 windows-arm64 原生包版本覆盖不全，
      # 交给 uv 按请求装（x64 解释器在 WoA 上模拟跑，产物即 x64）
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install deps
        working-directory: vendor/Typhoeus
        shell: bash
        run: |
          uv python install "${{ matrix.py_request }}"
          uv sync --frozen --no-dev --python "${{ matrix.py_request }}"

      - name: PyInstaller onefile
        working-directory: vendor/Typhoeus
        shell: bash
        run: |
          uv run --python "${{ matrix.py_request }}" --frozen \
            --with pyinstaller --with pyinstaller-hooks-contrib \
            pyinstaller --clean --noconfirm --onefile \
              --name quaver-server \
              --distpath dist-bin --workpath build/pyi --specpath build/pyi \
              --hidden-import uvicorn.logging \
              --hidden-import uvicorn.loops.auto \
              --hidden-import uvicorn.loops.asyncio \
              --hidden-import uvicorn.protocols.http.auto \
              --hidden-import uvicorn.protocols.http.h11_impl \
              --hidden-import uvicorn.protocols.websockets.auto \
              --hidden-import uvicorn.protocols.websockets.wsproto_impl \
              --hidden-import uvicorn.protocols.websockets.websockets_impl \
              --hidden-import python_socks \
              --copy-metadata qqmusic-api-python \
              build_entry.py

      - name: Smoke test binary
        working-directory: vendor/Typhoeus
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qv-cfg"
          QUAVER_CONFIG_DIR="$RUNNER_TEMP/qv-cfg" QUAVER_PORT=3999 ./dist-bin/quaver-server.exe > "$RUNNER_TEMP/sidecar-ci.log" 2>&1 &
          SERVER_PID=$!
          status=1
          for i in $(seq 1 60); do
            sleep 1
            if curl -fsS --max-time 3 http://127.0.0.1:3999/login/status >/dev/null 2>&1; then
              echo "sidecar OK"; status=0; break
            fi
          done
          kill $SERVER_PID 2>/dev/null
          [ "$status" = 0 ] || cat "$RUNNER_TEMP/sidecar-ci.log"
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-windows-${{ matrix.arch_label }}
          path: vendor/Typhoeus/dist-bin/quaver-server.exe

  # macOS：只出 arm64（x86 构建已裁撤——universal 合并要求包内所有 Mach-O 双架构，
  # 而 cryptography 自 48 起没有 intel macOS wheel、mpv 官方包两侧结构也不对称，得不偿失）。
  sidecar-macos:
    name: sidecar macos (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/QQMusicApi
          git submodule update --init --depth 1 vendor/Typhoeus

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install deps
        working-directory: vendor/Typhoeus
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --frozen --no-dev --python 3.11   # cryptography 50.0.1 有 macosx_11_0_arm64 wheel
          uv pip install --python .venv/bin/python pyinstaller pyinstaller-hooks-contrib

      - name: PyInstaller onefile (arm64)
        working-directory: vendor/Typhoeus
        run: |
          set -euo pipefail
          # distpath 用仓库根的 dist-bin（smoke/upload 都以它为准）；
          # PyInstaller 的相对路径是相对 working-directory 的，必须显式爬出去
          mkdir -p ../../dist-bin
          .venv/bin/python -m PyInstaller --clean --noconfirm --onefile \
            --name quaver-server \
            --distpath ../../dist-bin --workpath build/pyi --specpath build/pyi \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import python_socks \
            --copy-metadata qqmusic-api-python \
            build_entry.py
          lipo -info ../../dist-bin/quaver-server | grep -q arm64
          chmod +x ../../dist-bin/quaver-server

      - name: Smoke test binary
        working-directory: vendor/Typhoeus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qv-cfg"
          QUAVER_CONFIG_DIR="$RUNNER_TEMP/qv-cfg" QUAVER_PORT=3999 \
            ../../dist-bin/quaver-server > "$RUNNER_TEMP/sidecar-ci.log" 2>&1 &
          pid=$!
          status=1
          for i in $(seq 1 60); do
            sleep 1
            curl -fsS --max-time 3 http://127.0.0.1:3999/login/status >/dev/null 2>&1 && { echo "sidecar OK"; status=0; break; }
          done
          kill $pid 2>/dev/null || true
          [ "$status" = 0 ] || { cat "$RUNNER_TEMP/sidecar-ci.log"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-macos-arm64
          path: dist-bin/quaver-server

  # loongarch64（新世界 ABI 2.0）：无原生 runner → QEMU binfmt + loong64 容器里构建。
  # Rust 依赖全靠 loong64 社区镜像的预编译 wheel（见文件头注），PyInstaller 从 sdist
  # 编译自带 bootloader（纯 C）。smoke 在宿主机直接跑产物（binfmt 接管 loong64 ELF）。
  sidecar-loong64:
    name: sidecar loong64 (ABI2.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/QQMusicApi
          git submodule update --init --depth 1 vendor/Typhoeus

      # master 标签的 binfmt 才带 qemu-loongarch64（Loongson 云社区文档口径）
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:master
          platforms: loong64

      - name: Build sidecar in loong64 container
        run: |
          docker run --rm --platform linux/loong64 \
            -v "$GITHUB_WORKSPACE":/src \
            ghcr.io/loong64/python:3.11 \
            bash /src/.github/scripts/loong64-sidecar.sh

      - name: Smoke test binary (QEMU user-mode)
        run: |
          set -euo pipefail
          mkdir -p /tmp/qv-cfg-la
          QUAVER_CONFIG_DIR=/tmp/qv-cfg-la QUAVER_PORT=3999 \
            ./dist-bin/quaver-server-loong64 > /tmp/sidecar-la.log 2>&1 &
          pid=$!
          status=1
          for i in $(seq 1 120); do   # onefile 首启要在 QEMU 下解包，放宽容忍
            sleep 1
            curl -fsS --max-time 3 http://127.0.0.1:3999/login/status >/dev/null 2>&1 && { echo "sidecar OK"; status=0; break; }
          done
          kill $pid 2>/dev/null || true
          [ "$status" = 0 ] || cat /tmp/sidecar-la.log
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-loong64
          path: dist-bin/quaver-server-loong64

  # ────────────────────────────── 前端（客户端包） ──────────────────────────────
  frontend-linux:
    name: AppImage (${{ matrix.arch_label }})
    needs: sidecar-linux
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86_64
            electron_arch: x64
            runs_on: ubuntu-24.04
          - arch_label: aarch64
            electron_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            vendor/Typhoeus/mpris/pnpm-lock.yaml

      # 顺序要紧：submodule 必须先 init，再往仓库里放产物，
      # 否则 checkout 后 vendor/Typhoeus 空目录被 sidecar 填充，submodule update
      # 会拒绝 clone 进非空目录（"already exists and is not an empty directory"）。
      # MPRIS 守护进程源码也在该 submodule（mpris/），esbuild 产物供 extraResources。
      # Typhoeus：sidecar 产物来源 + MPRIS 守护进程源码（mpris/）
      # Sparkle：插件 SDK，ui/tsconfig.json 的 paths 把 @quaver/sparkle 指到
      #          ../vendor/Sparkle/sdk —— 不 init 的话 tsc 全量 TS2307，缺类型再连锁
      #          TS7006/TS2339，构建直接挂
      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Typhoeus
          git submodule update --init --depth 1 vendor/Sparkle

      # sidecar 产物落仓库根 dist-bin/（.gitignore 已覆盖），不再碰 submodule 路径
      - name: Fetch sidecar for this arch
        uses: actions/download-artifact@v8
        with:
          name: sidecar-linux-${{ matrix.arch_label }}
          path: dist-bin

      - name: Build MPRIS daemon bundle
        working-directory: vendor/Typhoeus/mpris
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 随包音频运行时（mpv）：上游不发 Linux 二进制，脚本钉 pkgforge 的 AppImage（含版本 + sha256），
      # 在构建期 --appimage-extract 展开成目录再进 extraResources。运行期由 engine 用包内自带
      # loader + lib/lib.path 直启载荷 —— 不套第二层 FUSE，也不跑 sharun 的钩子
      # （自更新下载 / yt-dlp 弹窗），细节见 ui/electron/audio/bins.mjs 头部注释。
      - name: Stage bundled mpv runtime
        working-directory: ui
        run: ./scripts/stage-mpv.sh "${{ matrix.arch_label }}"

      # 验的就是生产解析路径本身（loader + lib.path + 真跑一次 --version）
      - name: Verify staged mpv runtime
        working-directory: ui
        run: node electron/audio/bins.mjs --check build-res/audio

      # extraResources 里约定文件名是 quaver-server（filter: quaver-server*）
      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          chmod +x quaver-server-${{ matrix.arch_label }}
          mv quaver-server-${{ matrix.arch_label }} quaver-server

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: electron-builder AppImage
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        # 注意：不给这一步设 GH_TOKEN——有 token 时 builder 会自动推导 GitHub publish
        # 配置，repository 缺失时 updateInfoBuilder 直接崩（reading 'channel'）。
        # --publish never 下它本来也不需要。
        run: |
          ARGS="--linux AppImage --${{ matrix.electron_arch }} --publish never"
          ARGS="$ARGS --config.extraMetadata.version=${{ steps.version.outputs.version }}"
          npx electron-builder $ARGS

      # 断言打进包里的运行时真能跑：跨架构/缺库不会报错、只会跑不起来（exec 126），
      # 且 AppImage 是只读挂载 —— 运行时没法 chmod 补救，必须在 CI 就验过。
      - name: Verify bundled mpv inside AppImage
        working-directory: ui
        run: |
          set -euo pipefail
          ./release/Quaver-*.AppImage --appimage-extract >/dev/null
          root=squashfs-root
          [ -d "$root/resources/audio/mpv" ] || root=AppDir   # 解包目录名随 runtime 而异
          node electron/audio/bins.mjs --check "$root/resources/audio"

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-appimage-${{ matrix.arch_label }}
          path: ui/release/Quaver-*.AppImage
          if-no-files-found: error

  # Windows：前端全在 x64 runner 上交叉打包（electron-builder 直接支持 arm64 目标）。
  # arm64 的 mpv 在 x64 机器上跑不了 → 随包校验靠暂存脚本里的 PE 机器码核对。
  frontend-windows:
    name: NSIS (${{ matrix.arch_label }})
    needs: sidecar-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x64
          - arch_label: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            vendor/Typhoeus/mpris/pnpm-lock.yaml

      - name: Init submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 vendor/Typhoeus
          git submodule update --init --depth 1 vendor/Sparkle

      - name: Fetch sidecar
        uses: actions/download-artifact@v8
        with:
          name: sidecar-windows-${{ matrix.arch_label }}
          path: dist-bin

      - name: Build MPRIS daemon bundle
        working-directory: vendor/Typhoeus/mpris
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 随包音频运行时（mpv 官方 release）：x64=mingw（自带 DLL）、arm64=msvc（静态链接）。
      # 平铺 mpv.exe 布局，运行期 bins.mjs 直接 spawn（见其 win32 分支）。
      - name: Stage bundled mpv runtime
        working-directory: ui
        shell: bash
        run: node scripts/stage-mpv-official.mjs win32 ${{ matrix.arch_label }}

      # x64 才能真跑一遍（arm64 载荷在 x64 机器上只会 exec 126，校验在暂存脚本里做 PE 机器码）
      - name: Verify staged mpv runtime
        if: matrix.arch_label == 'x64'
        working-directory: ui
        shell: bash
        run: node electron/audio/bins.mjs --check build-res/audio

      - name: pnpm install
        working-directory: ui
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        shell: bash
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: electron-builder NSIS
        working-directory: ui
        shell: bash
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx electron-builder --win nsis --${{ matrix.arch_label }} --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-windows-${{ matrix.arch_label }}
          path: ui/release/Quaver-*.exe
          if-no-files-found: error

  # macOS arm64：Electron / sidecar / 随包 mpv 全单架构，无 universal 合并。
  frontend-macos:
    name: dmg (arm64)
    needs: sidecar-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            vendor/Typhoeus/mpris/pnpm-lock.yaml

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Typhoeus
          git submodule update --init --depth 1 vendor/Sparkle

      - name: Fetch sidecar
        uses: actions/download-artifact@v8
        with:
          name: sidecar-macos-arm64
          path: dist-bin

      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          # artifact 走 zip 不保权限，必须补 exec 位
          chmod +x quaver-server

      - name: Build MPRIS daemon bundle
        working-directory: vendor/Typhoeus/mpris
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 随包音频运行时（mpv 官方 release，arm64 单架构）：
      # 自包含 mpv.app（自带 dylib rpath），bins.mjs 直接 spawn（见其 darwin 分支）
      - name: Stage bundled mpv runtime
        working-directory: ui
        run: node scripts/stage-mpv-official.mjs darwin arm64

      - name: Verify staged mpv runtime
        working-directory: ui
        run: |
          set -euo pipefail
          node electron/audio/bins.mjs --check build-res/audio

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: electron-builder dmg (arm64)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # 无证书，跳过签名（identity: null 兜底）
        run: |
          npx electron-builder --mac dmg --arm64 --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }}

      # 挂载 dmg 验随包运行时与 sidecar 确实在位（arm 原生跑）
      - name: Verify bundled runtime inside dmg
        working-directory: ui
        run: |
          set -euo pipefail
          dmg=$(ls release/Quaver-*.dmg | head -1)
          mount="$RUNNER_TEMP/dmg-mount"   # hdiutil 的 -mountpoint 要求目录已存在
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true' EXIT
          app=$(ls -d "$mount"/*.app | head -1)
          node electron/audio/bins.mjs --check "$app/Contents/Resources/audio"
          [ -x "$app/Contents/Resources/bin/quaver-server" ]

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-macos-arm64
          path: ui/release/Quaver-*.dmg
          if-no-files-found: error

  # loongarch64：Electron 官方无 loong64 发行版 → 拿 x64 的 dir 包（electron-builder 只认
  # x64/arm64），把 Electron 本体换成 loongnix 的 v31.7.7 loong64 构建，resources（asar 与
  # extraResources）原样保留 —— 那部分与架构无关。产物为 tar.gz，无 AppImage runtime。
  frontend-loong64:
    name: tar.gz (loongarch64 ABI2.0)
    needs: sidecar-loong64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            vendor/Typhoeus/mpris/pnpm-lock.yaml

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Typhoeus
          git submodule update --init --depth 1 vendor/Sparkle

      - name: Fetch sidecar
        uses: actions/download-artifact@v8
        with:
          name: sidecar-loong64
          path: dist-bin

      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          chmod +x quaver-server-loong64
          mv quaver-server-loong64 quaver-server

      - name: Build MPRIS daemon bundle
        working-directory: vendor/Typhoeus/mpris
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # loong64 无预编译 mpv（pkgforge 只发 x86_64/aarch64）→ 不随包，运行期回落
      # 系统 mpv / <audio>。给 extraResources 留一个非空目录，免得打包报缺路径。
      - name: Prepare empty audio resource dir
        working-directory: ui
        run: |
          mkdir -p build-res/audio
          echo "loongarch64 不随包 mpv，运行期回落系统 mpv / <audio>" > build-res/audio/README.txt

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      # 先出 x64 dir 包拿 resources，再换 loong64 Electron 本体
      - name: electron-builder dir (x64, 只为取 resources)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx electron-builder --linux dir --x64 --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Swap in loong64 Electron and pack tar.gz
        working-directory: ui
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.version }}"
          ELECTRON_VER=31.7.7
          url="https://ftp.loongnix.cn/electron/LoongArch/v${ELECTRON_VER}/electron-v${ELECTRON_VER}-linux-loong64.zip"
          sha="e0c756ca8a66dde3bece6ad902f152f539365ce7442d6353871d7c54d1c0f47b"
          curl -fsSL --retry 3 -o /tmp/electron-la.zip "$url"
          echo "$sha  /tmp/electron-la.zip" | sha256sum -c - >/dev/null || {
            echo "✗ loongnix electron zip sha256 不匹配（上游重发布？）" >&2; exit 1; }
          rm -rf la-electron && mkdir la-electron
          unzip -q /tmp/electron-la.zip -d la-electron
          # resources 全量换成 dir 包的（app.asar + extraResources：bin/mpris/build-res/audio）
          rm -rf la-electron/resources
          cp -a release/linux-unpacked/resources la-electron/resources
          # electron-builder 会把可执行文件改名成 executableName（quaver）；同 binary，照做
          mv la-electron/electron la-electron/quaver
          chmod 4755 la-electron/chrome-sandbox   # 沙盒需要 setuid（zip 不一定保住权限位）
          # 断言换上的真是 LoongArch：跨架构不报错、只是跑不起来，必须看 ELF
          readelf -h la-electron/quaver | grep -q LoongArch || {
            echo "✗ 换上的 Electron 不是 LoongArch"; exit 1; }
          readelf -h "$GITHUB_WORKSPACE/dist-bin/quaver-server" | grep -q LoongArch || {
            echo "✗ sidecar 不是 LoongArch"; exit 1; }
          mkdir -p release
          tar --no-same-owner -czf "release/Quaver-${ver}-loong64.tar.gz" -C la-electron .

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-loong64
          path: ui/release/Quaver-*-loong64.tar.gz
          if-no-files-found: error

  # ───────────────────────────── Release ─────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend-linux, frontend-windows, frontend-macos, frontend-loong64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # sidecar 与音频运行时已随 extraResources 打进各平台包，Release 只发客户端本体
      - uses: actions/download-artifact@v8
        with:
          pattern: "quaver-*"
          merge-multiple: true
          path: out

      - name: Publish GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out/
          # -R 显式指定仓库：此 job 无 checkout，gh 靠 git 推断仓库会 fatal
          # --draft：只建草稿不上线，人工核对产物/说明后到 Releases 页手动 Publish
          gh release create "$GITHUB_REF_NAME" \
            -R "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            out/Quaver-*

  # ─────────────────────────── 每夜版 Release ───────────────────────────
  # 滚动发布：tag/release 名恒为 nightly，每次构建覆盖上一次（含旧 tag 清理），
  # 产物名里带短 commit id，所以下载下来就知道是哪个 commit 构建的。
  nightly:
    if: github.event_name == 'schedule' || inputs.nightly == true
    needs: [frontend-linux, frontend-windows, frontend-macos, frontend-loong64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "quaver-*"
          merge-multiple: true
          path: out

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out/
          sha="${GITHUB_SHA:0:7}"
          notes=$(mktemp)
          {
            echo "每夜版自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，对应 commit \`$GITHUB_SHA\`。"
            echo
            echo "包名里的 \`$sha\` 即 commit id。平台覆盖：Linux AppImage（x86_64/aarch64）、"
            echo "Windows NSIS（x64/arm64）、macOS dmg（arm64）、loongarch64 tar.gz（ABI2.0）。"
            echo
            echo "**非稳定版本**，仅用于验证最新改动。"
          } > "$notes"
          # 昨天那份（release + tag）先删掉；首次跑没有，允许失败
          gh release delete nightly -R "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "no previous nightly release, publishing the first one"
          # -R 显式指定仓库：此 job 无 checkout，gh 靠 git 推断仓库会 fatal
          gh release create nightly \
            -R "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $sha ($(date -u +%Y-%m-%d))" \
            --notes-file "$notes" \
            out/Quaver-*
