# Quaver — 全平台打包 CI
#
# 后端：vendor/Typhoeus-go（Go sidecar）→ 交叉编译，一个 Linux runner 出全平台二进制
# 音频：vendor/Liino（Go 音频管线）→ c-shared 动态库 + @team-quaver/liino-node 绑定
# 前端：ui (Electron + Vite) → 平台安装包（随包对应架构的 sidecar、mpv 与 libliino）
#
# 目标平台：
#   linux    x86_64 + aarch64 → AppImage / Flatpak（自包含），另出 deb / rpm / pacman：
#            不随包音频运行时，依赖 mpv + ffmpeg + pipewire（bins.ts 三级兜底自动落宿主 PATH）
#   windows  x64 + arm64      → NSIS（前端全在 x64 上交叉打包）
#   macos    arm64 → dmg（x86 构建已裁撤）
#   linux    loong64 → sidecar 二进制 + 客户端 deb/rpm（Electron 用 darkyzhou/electron-loong64
#             社区构建，new-world ABI 2.0；mpv 不随包，交给发行版解析；打包走
#             @loongdotjs/electron-builder 分支，deb/rpm 配置与其它架构同一套模板）
#
# Liino 构建（liino-linux / liino-windows / liino-macos）：
#   每个目标只出两件东西：c-shared 库 + 头文件。Linux amd64/arm64 在原生 runner 上构建；
#   loong64 交给 OpenListTeam/cgo-actions 的 linux-loong64 目标（ABI2.0 / new-world，
#   与 darkyzhou/electron-loong64 的客户端 ABI 对齐）；Windows 的 amd64/arm64 在 Linux 上用
#   llvm-mingw 交叉（capi 的导出层是唯一需要 C 链接器的地方）；macOS 只出 arm64，在
#   macos-15 上用 Xcode SDK 原生构建。产物按 <goos>-<goarch> 命名上传，
#   前端 job 下载后落到 ui/build-res/liino/<goos>-<goarch>/，再由 extraResources 随包。
#   Node 绑定是纯 TS（运行时由 koffi dlopen 库），一次 tsc 构建后作为 liino-node-dist 分发。
#
#   为什么只有 loong64 走 cgo-actions：动作里 xgo 引擎（linux / windows-amd64 / darwin）
#   把产物名按可执行文件后缀硬编码（windows 只认 .exe），而 c-shared 会出 .so/.dll/.dylib，
#   它随后的 mv 会直接失败；loong64 与 windows-arm64 引擎是直接 go build 到临时名，才吃得了
#   -buildmode=c-shared。Linux amd64/arm64 与 macOS 本来就有原生 C 工具链（不值得绕 Docker），
#   Windows amd64 则只剩 xgo 这条路，所以这两个 job 继续用原方案。
#
# 打包配置：
#   electron-builder 的目标/依赖等配置拆在 packages/，按「发行版 + 架构组」命名；
#   ARM/x86 同一档共用 arm-x86.yml，loong64 只额外覆写 Electron 下载源与 RPM strip 设置。
#   Flatpak manifest 在 packages/flatpak。
#
# 口径：
#   - sidecar 纯 Go（唯一依赖 gorilla/websocket，零 cgo）→ CGO_ENABLED=0 交叉编译即可，
#     PyInstaller 时代的 wheel / QEMU / WoA 模拟问题全部消失。跨架构二进制「不报错、
#     只跑不起来」→ 非原生档用 file 核对机器码，linux x86_64 档真跑 smoke。
#   - mpv 官方 release 只发 Windows + macOS 二进制：Windows 用 mingw x64（自带全套 DLL）+
#     msvc arm64（静态链接）；macOS 用 macos-14 arm 单份 zip（自包含 mpv.app）—— 上游按构建机的
#     macOS 版本出 macos-14 / 15 / 26 三份，Mach-O 的 minos 就是那个版本号，装高了在老系统上
#     一启动就被 dyld 拒（v0.41 的 macos-15 那份在 macOS 14 上直接 SIGABRT），所以取最低档 14。
#     Linux 的 AppImage 用 pkgforge AppImage（x86_64/aarch64）；同台的 deb/rpm/pacman
#     不随包音频运行时 —— mpv/ffmpeg/pipewire 作为发行版依赖在安装时解析。
#
# 触发：
#   - push 到 main / PR：只出 artifact
#   - 打 v* tag：额外创建 GitHub Release（版本号 = tag 去掉 v）。
#       tag 含 beta（如 v1.5.0-beta.1）→ 以 **prerelease** 直接上线，供客户端「Beta 渠道」识别；
#       其余正式 tag                 → 先建 **草稿**，人工检查产物后手动 Publish
#       ⚠ tag 必须是合法 semver：v<major>.<minor>.<patch>[-<prerelease>]，分段用 `-`。
#       写成 v1.4.5_beta.1（下划线）会被 resolve-version 直接拦下 —— Debian 的 Version
#       字段不认 `_`，客户端的 parseVersion 也解析不出 prerelease 段，两边都会静默出错。
#   - 每夜定时 / 手动勾 nightly：版本号 = <package.json 版本>-<短 commit id>-nightly，
#     发布到滚动 Release「nightly」（覆盖昨天的）
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # 每天 18:00 UTC（北京时间次日 02:00）
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: 按每夜版构建（版本号带 commit id，并发布/覆盖滚动 Release「nightly」）
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────── 校验门禁（先于一切打包） ──────────────────────────────
jobs:
  # typecheck + 静态护栏（verify:static）+ 真实产物形状（build → verify:bundle）。
  # 所有打包 job 都 needs 它：源码坏了/首屏预算红了就立刻失败，别再烧几十分钟
  # 的交叉编译矩阵（判据与来由见 ui/scripts/verify-bundle.ts 头注）。
  verify:
    name: verify (typecheck + guards + bundle shape)
    needs: liino-node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml

      # Sparkle：插件 SDK（@quaver/sparkle 的 paths 指到 ../vendor/Sparkle/sdk）；
      # Typhoeus-go：sidecar 的 Go 源码，verify-song-menu 等护栏要读它的 server/*.go；
      # Liino：ui/package.json 的 @team-quaver/liino-node 是 file: 依赖，目录不在
      #        pnpm install 直接 ENOENT scandir vendor/Liino/node
      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Sparkle vendor/Typhoeus-go vendor/Liino

      # 绑定是 file: 依赖，package.json 的 types/main 都指向 dist/；dist 不入库，
      # 必须先把 liino-node 的 tsc 产物铺回来，否则 typecheck 找不到声明文件
      - name: Fetch Liino Node bindings
        uses: actions/download-artifact@v8
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Typecheck (renderer)
        working-directory: ui
        run: pnpm run typecheck

      - name: Static guards (verify:static)
        working-directory: ui
        run: pnpm run verify:static

      - name: Build dist + Check bundle shape (首屏预算 / 懒加载缝 / 体积上限)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm run build
          pnpm run verify:bundle

  # ────────────────────────────── 后端（sidecar，Go 交叉编译） ──────────────────────────────
  # 纯 Go（唯一依赖 gorilla/websocket，零 cgo）→ 一个 ubuntu runner 交叉编译全部目标。
  # artifact 名与二进制名沿用 PyInstaller 时代的约定（sidecar-linux-x86_64 / quaver-server /
  # quaver-server.exe），前端 job 因此零改动。loong64 = Go 官方支持矩阵内的交叉编译目标，
  # loong64 客户端包不随包 mpv，仍走发行版依赖。
  sidecar:
    name: sidecar (${{ matrix.arch_label }})
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 前端消费的六档 ──
          - arch_label: linux-x86_64
            goos: linux
            goarch: amd64
            artifact: sidecar-linux-x86_64
            bin: quaver-server-x86_64
          - arch_label: linux-aarch64
            goos: linux
            goarch: arm64
            artifact: sidecar-linux-aarch64
            bin: quaver-server-aarch64
          - arch_label: windows-x64
            goos: windows
            goarch: amd64
            artifact: sidecar-windows-x64
            bin: quaver-server.exe
          - arch_label: windows-arm64
            goos: windows
            goarch: arm64
            artifact: sidecar-windows-arm64
            bin: quaver-server.exe
          - arch_label: macos-arm64
            goos: darwin
            goarch: arm64
            artifact: sidecar-macos-arm64
            bin: quaver-server
          # ── 龙芯：客户端包不随包 mpv ──
          - arch_label: linux-loong64
            goos: linux
            goarch: loong64
            artifact: sidecar-linux-loong64
            bin: quaver-server-loong64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodule vendor/Typhoeus-go
        run: git submodule update --init --depth 1 vendor/Typhoeus-go

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: vendor/Typhoeus-go/go.sum

      # qmc 与 unlock-music 的跨语言对拍向量 + zzc 签名对拍；server 含缓存命中/播放流回归
      - name: Test (qmc 对拍 + 签名 + server)
        working-directory: vendor/Typhoeus-go
        run: go test ./inhibit/ ./qmc/ ./qqmusic/ ./server/

      - name: Build
        working-directory: vendor/Typhoeus-go
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../../dist-bin
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" \
            -o "../../dist-bin/${{ matrix.bin }}" ./cmd/quaver-server

      # linux x86_64 档在原生 runner 上真跑一遍（Go 起服务很快，5s 足够）
      - name: Smoke test (linux x86_64 原生)
        if: matrix.arch_label == 'linux-x86_64'
        working-directory: vendor/Typhoeus-go
        run: |
          mkdir -p "$HOME/.config/quaver"
          QUAVER_PORT=3999 ../../dist-bin/quaver-server-x86_64 > /tmp/sidecar-ci.log 2>&1 &
          SERVER_PID=$!
          status=1
          for i in $(seq 1 15); do
            sleep 1
            if curl -fsS --max-time 3 http://127.0.0.1:3999/login/status >/dev/null 2>&1; then
              echo "sidecar OK"; status=0; break
            fi
          done
          kill $SERVER_PID 2>/dev/null
          [ "$status" = 0 ] || cat /tmp/sidecar-ci.log
          exit $status

      # 跨架构二进制不报错、只会跑不起来（exec 126）→ 非原生档核对机器码
      - name: Verify target machine (cross-compiled)
        if: matrix.arch_label != 'linux-x86_64'
        run: |
          set -euo pipefail
          f="dist-bin/${{ matrix.bin }}"
          [ -s "$f" ] || { echo "::error::产物为空"; exit 1; }
          want="${{ matrix.goos }}/${{ matrix.goarch }}"
          case "$want" in
            linux/arm64)   file "$f" | grep -q "ARM aarch64" ;;
            linux/loong64) file "$f" | grep -qi "LoongArch" ;;
            windows/amd64) file "$f" | grep -q "x86-64" ;;
            # file ≤5.45（含 CI 的 ubuntu-24.04）打 "Aarch64"，5.46 起改打 "ARM64" → 两者都收
            windows/arm64) file "$f" | grep -qiE "aarch64|arm64" ;;
            darwin/arm64)  file "$f" | grep -q "arm64" ;;
            *) echo "::error::未知的交叉目标 $want"; exit 1 ;;
          esac
          echo "machine check OK: $want"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-bin/${{ matrix.bin }}
          if-no-files-found: error

  # ────────────────────────────── Liino（动态库 + Node 绑定） ──────────────────────────────
  # 绑定层是纯 TS（libliino.ts 通过 koffi 在运行时 dlopen 库），平台无关，构建一次即可。
  # 注意 dist/ 不在子模块仓库里（.gitignore），所以所有消费方（verify / 前端打包）都必须
  # 依赖这个 job 并下载 liino-node-dist，否则 file: 依赖指向的 dist/index.d.ts 不存在。
  liino-node:
    name: liino node bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodule vendor/Liino
        run: git submodule update --init --depth 1 vendor/Liino

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: vendor/Liino/node/package-lock.json

      - name: Build bindings (tsc) + pack
        working-directory: vendor/Liino/node
        # koffi 是 peerDependency，只在运行时用；--ignore-scripts 跳过它的预编译下载
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: liino-node-package
          path: vendor/Liino/node/team-quaver-liino-node-*.tgz
          if-no-files-found: error

  # Linux：amd64/arm64 在对应原生 runner 上直接构建（宿主 cc，无交叉工具链）。
  # loong64 交给 OpenListTeam/cgo-actions 的 linux-loong64 目标 —— 它下载 ABI2.0
  # （new-world）的 GCC/Go 交叉工具链，与 darkyzhou/electron-loong64 的客户端 ABI 一致。
  # 别写成 linux-loong64-abi1.0：那是 old-world ABI1.0，产物进不了我们的包。
  liino-linux:
    name: liino lib (linux-${{ matrix.goarch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runs_on: ubuntu-24.04
            builder: native
          - goarch: arm64
            runs_on: ubuntu-24.04-arm
            builder: native
          - goarch: loong64
            runs_on: ubuntu-24.04
            builder: cgo-actions
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodule vendor/Liino
        run: git submodule update --init --depth 1 vendor/Liino

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: vendor/Liino/go.sum

      - name: Build libliino.so (native)
        if: matrix.builder == 'native'
        working-directory: vendor/Liino
        env:
          CC: cc
        run: bash scripts/build-capi.sh linux ${{ matrix.goarch }}

      # 动作的 flags 输入会把整串当成单个 argv（execa 模板表达式不拆空格），所以
      # buildmode / trimpath 放进 GOFLAGS（go 只取当前命令认识的项，`go version` 会忽略），
      # ldflags 留在 flags 里 —— 它的值本身含空格，正好作为一个 argv 交给 -ldflags。
      - name: Build libliino.so (cgo-actions, linux-loong64)
        if: matrix.builder == 'cgo-actions'
        uses: OpenListTeam/cgo-actions@v1.3.0
        env:
          GOFLAGS: "-buildmode=c-shared -trimpath"
        with:
          dir: vendor/Liino
          packages: ./capi
          targets: linux-loong64
          tags: liino_capi
          flags: "-ldflags=-s -w"
          out-dir: vendor/Liino/build/linux-loong64
          output: libliino.so
          github-token: ${{ github.token }}

      # c-shared 的头文件跟着临时产物名走（go-cross-bin.h），改成发布名
      - name: Stage cgo-actions header (loong64)
        if: matrix.builder == 'cgo-actions'
        run: |
          set -euo pipefail
          mv vendor/Liino/go-cross-bin.h vendor/Liino/build/linux-loong64/liino.h

      # 跨架构产物不报错、只会跑不起来 → 核对机器码；三个目标都覆盖
      - name: Verify target machine
        run: |
          set -euo pipefail
          f="vendor/Liino/build/linux-${{ matrix.goarch }}/libliino.so"
          [ -s "$f" ] || { echo "::error::产物为空"; exit 1; }
          case "${{ matrix.goarch }}" in
            amd64)   file "$f" | grep -q "x86-64" ;;
            arm64)   file "$f" | grep -q "ARM aarch64" ;;
            loong64) file "$f" | grep -qi "LoongArch" ;;
            *) echo "::error::未知目标"; exit 1 ;;
          esac
          echo "machine check OK: linux/${{ matrix.goarch }}"

      # amd64/arm64 是原生 runner：真 dlopen + 调一次导出函数（file 只能证明机器码，
      # 证明不了 c-shared 的依赖/ABI 能加载）。loong64 是交叉档，只能留在机器码检查。
      - name: Smoke test (native dlopen)
        if: matrix.goarch != 'loong64'
        run: |
          set -euo pipefail
          python3 - "$PWD/vendor/Liino/build/linux-${{ matrix.goarch }}/libliino.so" <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.liino_version.restype = ctypes.c_char_p
          version = lib.liino_version().decode()
          assert version, "liino_version returned empty"
          print(f"liino dlopen OK: {version}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: liino-linux-${{ matrix.goarch }}
          path: vendor/Liino/build/linux-${{ matrix.goarch }}
          if-no-files-found: error

  # Windows：两个架构都在 Ubuntu 上用 llvm-mingw 交叉。不用 windows runner 的 MSYS2，
  # 是因为这里只需要 C 链接器，而 llvm-mingw 同时提供 aarch64-w64-windows-gnu 目标。
  # 交叉产物用 file 核对 PE 机器码（Windows runner 上没有 file(1)）。
  # 这里不能换成 cgo-actions：windows-amd64 走它的 xgo 引擎，该引擎把产物名写死成
  # <name>-windows-amd64.exe，而 c-shared 出的是 .dll，构建后的 mv 会失败；
  # windows-arm64 直连 zig 引擎虽可行，但没必要为半个矩阵换一套工具链（zig 还是 beta）。
  liino-windows:
    name: liino lib (windows-${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20261104"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            cc: x86_64-w64-mingw32-clang
          - goarch: arm64
            cc: aarch64-w64-mingw32-clang
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodule vendor/Liino
        run: git submodule update --init --depth 1 vendor/Liino

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: vendor/Liino/go.sum

      - name: Install llvm-mingw
        run: |
          set -euo pipefail
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      # 上游 capi.go 的 cgo preamble 只有 stdlib/string.h；mingw 的 stdlib.h 不会
      # 间接带出 stdint.h，于是 C.int64_t 解析失败。补一行 preamble 再构建。
      # （glibc/macOS SDK 会间接带出 stdint.h，所以只有 Windows 交叉档需要这一步。）
      - name: Patch cgo preamble for mingw
        working-directory: vendor/Liino
        run: |
          set -euo pipefail
          if ! grep -q '#include <stdint.h>' capi/capi.go; then
            sed -i 's|#include <string.h>|#include <string.h>\n#include <stdint.h>|' capi/capi.go
          fi

      - name: Build liino.dll
        working-directory: vendor/Liino
        env:
          CC: ${{ matrix.cc }}
        run: bash scripts/build-capi.sh windows ${{ matrix.goarch }}

      - name: Verify target machine
        run: |
          set -euo pipefail
          f="vendor/Liino/build/windows-${{ matrix.goarch }}/liino.dll"
          [ -s "$f" ] || { echo "::error::产物为空"; exit 1; }
          case "${{ matrix.goarch }}" in
            amd64) file "$f" | grep -q "x86-64" ;;
            arm64) file "$f" | grep -qiE "ARM64|aarch64" ;;
            *) echo "::error::未知目标"; exit 1 ;;
          esac
          echo "machine check OK: windows/${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: liino-windows-${{ matrix.goarch }}
          path: vendor/Liino/build/windows-${{ matrix.goarch }}
          if-no-files-found: error

  # macOS：只出 arm64（x64 客户端构建已裁撤）。deployment target 钉 12.0：c-shared 的
  # minos 会写进 Mach-O，别让 runner 的 macOS 15 把库抬到只有新系统能加载。
  # cgo-actions 的 darwin 目标走 xgo（Linux 上的 Docker + osxcross），既跑不了 macos runner，
  # 也拿不到这里需要的 CGO_LDFLAGS（AudioToolbox/CoreAudio 框架），所以保持原生构建。
  liino-macos:
    name: liino lib (darwin-arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodule vendor/Liino
        run: git submodule update --init --depth 1 vendor/Liino

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: vendor/Liino/go.sum

      # darwin 上两个 purego fork 都会展开 dlfcn_stubs.s，各自定义未加包前缀的
      # TEXT dlopen/dlsym/dlerror/dlclose → 同一个 dylib 里两份同名 STEXT，
      # Go linker 直接 "duplicated definition of symbol dlopen"。
      # ffgo 用到的 purego API（Dlopen/RegisterLibFunc/NewCallback/CDecl）与 ebitengine
      # 同源，macOS 构建时把 ffgo 统一到 ebitengine；purego-pipewire 是 linux-only，
      # 不参与 darwin 链接，所以不会引入第三份。
      - name: Unify purego fork for darwin
        working-directory: vendor/Liino
        run: |
          set -euo pipefail
          # runner 是 BSD sed：原地改必须写成 -i ''
          files=$(grep -rl '"github.com/bnema/purego"' --include='*.go' third_party/ffgo || true)
          [ -n "$files" ] || { echo "::error::ffgo 里没找到 bnema/purego 引用"; exit 1; }
          printf '%s\n' "$files" | while IFS= read -r f; do
            sed -i '' 's|"github.com/bnema/purego"|"github.com/ebitengine/purego"|g' "$f"
          done
          sed -i '' 's|github.com/bnema/purego v0.11.0-bnema.3|github.com/ebitengine/purego v0.11.1|' third_party/ffgo/go.mod

      - name: Build libliino.dylib
        working-directory: vendor/Liino
        env:
          CC: clang
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # audio-go 的 darwin 层用 //go:cgo_import_dynamic 直接引用
          # AudioToolbox/CoreAudio；-buildmode=c-shared 固定走外部链接，
          # 这些动态导入由 clang 解析。runtime/cgo 只默认带
          # CoreFoundation/Security，不补 framework 就是 _AudioQueue*/
          # _AudioObject* undefined。
          CGO_LDFLAGS: "-framework CoreFoundation -framework AudioToolbox -framework CoreAudio"
        run: bash scripts/build-capi.sh darwin arm64

      - name: Verify target machine
        run: |
          set -euo pipefail
          f="vendor/Liino/build/darwin-arm64/libliino.dylib"
          [ -s "$f" ] || { echo "::error::产物为空"; exit 1; }
          file "$f" | grep -q "arm64"
          echo "machine check OK: darwin/arm64"

      # 原生档：真 dlopen + 调一次导出函数（file 只能证明机器码，证明不了能加载）
      - name: Smoke test (native dlopen)
        run: |
          set -euo pipefail
          python3 - "$PWD/vendor/Liino/build/darwin-arm64/libliino.dylib" <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.liino_version.restype = ctypes.c_char_p
          version = lib.liino_version().decode()
          assert version, "liino_version returned empty"
          print(f"liino dlopen OK: {version}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: liino-darwin-arm64
          path: vendor/Liino/build/darwin-arm64
          if-no-files-found: error

# ────────────────────────────── 前端（客户端包） ──────────────────────────────
  frontend-linux:
    name: AppImage (${{ matrix.arch_label }})
    needs: [verify, sidecar, liino-node, liino-linux]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86_64
            goarch: amd64
            electron_arch: x64
            runs_on: ubuntu-24.04
          - arch_label: aarch64
            goarch: arm64
            electron_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # 版本不在此处钉：读 ui/package.json 的 packageManager（pnpm@10.33.0），
      # 与本地/锁文件的书写版本严格同源，避免「CI 用 latest 10.x」漂移。
      # package_json_file 相对仓库根 —— 本仓库的 package.json 在 ui/ 子目录，根目录没有
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml

      # Sparkle：插件 SDK，ui/tsconfig.json 的 paths 把 @quaver/sparkle 指到
      #          ../vendor/Sparkle/sdk —— 不 init 的话 tsc 全量 TS2307，缺类型再连锁
      #          TS7006/TS2339，构建直接挂
      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Sparkle vendor/Liino

      # 绑定的 dist/ 不入库；pnpm 的 file: 依赖指向它，先铺回来再 install
      - name: Fetch Liino Node bindings
        uses: actions/download-artifact@v8
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist

      - name: Fetch Liino runtime
        uses: actions/download-artifact@v8
        with:
          name: liino-linux-${{ matrix.goarch }}
          path: dist-liino

      # 打包路径与 liino-runtime.ts 的解析口径一致：resources/liino/<platform>-<goarch>
      - name: Stage bundled Liino runtime
        run: |
          set -euo pipefail
          dest="ui/build-res/liino/linux-${{ matrix.goarch }}"
          mkdir -p "$dest"
          cp -f dist-liino/libliino.so dist-liino/liino.h "$dest/"
          test -s "$dest/libliino.so"

      # sidecar 产物落仓库根 dist-bin/（.gitignore 已覆盖），不再碰 submodule 路径
      - name: Fetch sidecar for this arch
        uses: actions/download-artifact@v8
        with:
          name: sidecar-linux-${{ matrix.arch_label }}
          path: dist-bin

      # 随包音频运行时（mpv）：上游不发 Linux 二进制，脚本钉 pkgforge 的 AppImage（含版本 + sha256），
      # 在构建期 --appimage-extract 展开成目录再进 extraResources。运行期由 engine 用包内自带
      # loader + lib/lib.path 直启载荷 —— 不套第二层 FUSE，也不跑 sharun 的钩子
      # （自更新下载 / yt-dlp 弹窗），细节见 ui/electron/audio/bins.ts 头部注释。
      - name: Stage bundled mpv runtime
        working-directory: ui
        run: ./scripts/stage-mpv.sh "${{ matrix.arch_label }}"

      # 验的就是生产解析路径本身（loader + lib.path + 真跑一次 --version）
      - name: Verify staged mpv runtime
        working-directory: ui
        run: node electron/audio/bins.ts --check build-res/audio

      # extraResources 里约定文件名是 quaver-server（filter: quaver-server*）
      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          chmod +x quaver-server-${{ matrix.arch_label }}
          mv quaver-server-${{ matrix.arch_label }} quaver-server

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build
      - name: Check bundle shape (首屏预算 / 懒加载缝 / 体积上限)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        # 验的是产物形状，不是总大小：入口静态闭包超预算、视图被改回静态导入、AMLL/词典/更新链路
        # 混进首屏 —— 都在这里拦下（判据与来由见 ui/scripts/verify-bundle.ts 头注）。
        run: pnpm run verify:bundle


      - name: electron-builder AppImage
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        # 注意：不给这一步设 GH_TOKEN——有 token 时 builder 会自动推导 GitHub publish
        # 配置，repository 缺失时 updateInfoBuilder 直接崩（reading 'channel'）。
        # --publish never 下它本来也不需要。
        run: |
          ARGS="--linux AppImage --${{ matrix.electron_arch }} --publish never"
          ARGS="$ARGS --config.extraMetadata.version=${{ steps.version.outputs.version }}"
          pnpm exec electron-builder $ARGS \
            --config ../packages/appimage/arm-x86.yml

      # 断言打进包里的运行时真能跑：跨架构/缺库不会报错、只会跑不起来（exec 126），
      # 且 AppImage 是只读挂载 —— 运行时没法 chmod 补救，必须在 CI 就验过。
      - name: Verify bundled mpv inside AppImage
        working-directory: ui
        run: |
          set -euo pipefail
          ./release/Quaver-*.AppImage --appimage-extract >/dev/null
          root=squashfs-root
          [ -d "$root/resources/audio/mpv" ] || root=AppDir   # 解包目录名随 runtime 而异
          node electron/audio/bins.ts --check "$root/resources/audio"
          # Liino 是可选后端，但「带上了却架构不对」比没带更糟 —— 产物里必须有本机那份
          test -s "$root/resources/liino/linux-${{ matrix.goarch }}/libliino.so"

      # ── 发行版原生包：deb / rpm / pacman ──
      # 与上面 AppImage 的「自包含」口径相反：这三个包不随包音频运行时，改走发行版依赖
      # 解析（deb Depends / rpm Requires / pacman depends 都是 mpv + ffmpeg + pipewire；
      # bins.ts 三级兜底自动落宿主 PATH 的系统 mpv）——与 loong64 deb/rpm 同一口径。
      # electron-builder 的 fpm 后端要 rpmbuild（打 rpm）与 bsdtar（组装 pacman 的
      # .pkg.tar.zst），zstd 供 GNU tar --zstd 用；ubuntu runner 都没预装，先装齐。
      - name: Install fpm backends (rpmbuild / bsdtar / zstd)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd

      # 清掉随包音频运行时再打这三个包：extraResources 的 `build-res/audio` 源缺失时
      # builder 只记一条 "file source doesn't exist" 警告并跳过，不是错误 —— 于是落进包里
      # 的就只有 sidecar + 前端，音源由发行版的 mpv 提供。（AppImage 已在上一轮打完，
      # 那份是自包含的，不受影响。）
      - name: Drop bundled mpv runtime (distro packages resolve mpv via Depends)
        working-directory: ui
        run: rm -rf build-res/audio

      - name: electron-builder deb/rpm/pacman
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        # 同 AppImage：不给这一步设 GH_TOKEN，避免 builder 自动推导 GitHub publish 配置。
        run: |
          pnpm exec electron-builder --linux deb --${{ matrix.electron_arch }} --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/debian/arm-x86.yml
          pnpm exec electron-builder --linux rpm --${{ matrix.electron_arch }} --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/rpm/arm-x86.yml
          pnpm exec electron-builder --linux pacman --${{ matrix.electron_arch }} --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/pacman/arm-x86.yml

      # electron-builder 的 ${arch} 宏只给 deb/rpm 做了映射（deb→amd64、rpm→x86_64），
      # pacman 档原样吐 "x64" → 对齐 Arch 口径改名 x86_64。只改文件名，包内元数据不动。
      - name: Normalize pacman artifact arch label
        working-directory: ui
        run: |
          set -euo pipefail
          for f in release/Quaver-*-x64.pkg.tar.zst; do
            [ -e "$f" ] || continue     # aarch64 runner 上没有这一档
            mv "$f" "${f%-x64.pkg.tar.zst}-x86_64.pkg.tar.zst"
          done

      # 硬口径自检：三个包的依赖都必须是 mpv + ffmpeg + pipewire。
      # rpm 的 rpmlib(...) / /bin/sh 是 rpm 工具链自带基线，滤掉后比对。
      - name: Verify distro package metadata (mpv/ffmpeg/pipewire dependencies)
        working-directory: ui
        run: |
          set -euo pipefail

          deb=$(ls release/Quaver-*.deb)
          ctrl=$(dpkg-deb -f "$deb")
          if ! grep -qx 'Depends: mpv, ffmpeg, pipewire' <<< "$ctrl"; then
            echo "::error::deb 依赖不是 mpv + ffmpeg + pipewire"; printf '%s\n' "$ctrl"; exit 1
          fi
          if grep -q '^Recommends:' <<< "$ctrl"; then
            echo "::error::deb 不该有 Recommends 行"; exit 1
          fi
          if ! grep -qE '^Architecture: (amd64|arm64)$' <<< "$ctrl"; then
            echo "::error::deb 架构异常"; printf '%s\n' "$ctrl"; exit 1
          fi

          rpm=$(ls release/Quaver-*.rpm)
          req=$(rpm -qp --requires "$rpm" | grep -vE '^(rpmlib\(|/bin/sh$)' | sort | paste -sd, -)
          if [ "$req" != 'ffmpeg,mpv,pipewire' ]; then
            echo "::error::rpm 依赖不是 mpv + ffmpeg + pipewire：$req"; exit 1
          fi
          # /usr/lib/.build-id/* 是 rpmbuild 的 find-debuginfo 后处理塞进来的链接器元数据，
          # 不是我们的载荷。我们随包的是 Electron 官方二进制，任何两个 Electron 包
          # （如 sparkle）都会因为这几个 ELF 字节相同而 build-id 相同 —— 双方都带上这几条，
          # dnf 就报「file ... conflicts」直接拒装。上游用 --rpm-rpmbuild-define
          # '_build_id_links none' 关掉生成，这里兜底断言，别再让脏包发出去。
          buildid=$(rpm -qpl "$rpm" | grep -E '^/usr/lib/\.build-id(/|$)' || true)
          if [ -n "$buildid" ]; then
            echo "::error::rpm 里混进了 /usr/lib/.build-id（会与其他 Electron 包撞文件、被 dnf 拒装）"
            printf '%s\n' "$buildid"
            exit 1
          fi

          pac=$(ls release/Quaver-*.pkg.tar.zst)
          pdep=$(bsdtar -xOf "$pac" .PKGINFO | sed -n 's/^depend *= *//p' | sort | paste -sd, -)
          if [ "$pdep" != 'ffmpeg,mpv,pipewire' ]; then
            echo "::error::pacman 依赖不是 mpv + ffmpeg + pipewire：$pdep"; exit 1
          fi
          echo "OK: deb/rpm/pacman depends = mpv + ffmpeg + pipewire"

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-appimage-${{ matrix.arch_label }}
          path: ui/release/Quaver-*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-linux-distro-${{ matrix.arch_label }}
          path: |
            ui/release/Quaver-*.deb
            ui/release/Quaver-*.rpm
            ui/release/Quaver-*.pkg.tar.zst
          if-no-files-found: error

  # Flatpak：x86_64 / aarch64 同一份 manifest。先在原生 runner 出未压缩 Electron 目录，
  # flatpak-builder 只负责打包 /app、接 zypak、写 AppStream 元数据。Flatpak 沙箱不能直接
  # 起宿主 PATH 的 mpv，所以这里沿用 AppImage 的自包含口径（pkgforge mpv 解包目录）。
  frontend-linux-flatpak:
    name: Flatpak (${{ matrix.flatpak_arch }})
    needs: [verify, sidecar, liino-node, liino-linux]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flatpak_arch: x86_64
            goarch: amd64
            electron_arch: x64
            runs_on: ubuntu-24.04
          - flatpak_arch: aarch64
            goarch: arm64
            electron_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Sparkle vendor/Liino

      - name: Fetch Liino Node bindings
        uses: actions/download-artifact@v8
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist

      - name: Fetch Liino runtime
        uses: actions/download-artifact@v8
        with:
          name: liino-linux-${{ matrix.goarch }}
          path: dist-liino

      - name: Stage bundled Liino runtime
        run: |
          set -euo pipefail
          dest="ui/build-res/liino/linux-${{ matrix.goarch }}"
          mkdir -p "$dest"
          cp -f dist-liino/libliino.so dist-liino/liino.h "$dest/"
          test -s "$dest/libliino.so"

      - name: Fetch sidecar for this arch
        uses: actions/download-artifact@v8
        with:
          name: sidecar-linux-${{ matrix.flatpak_arch }}
          path: dist-bin

      - name: Stage bundled mpv runtime
        working-directory: ui
        run: ./scripts/stage-mpv.sh "${{ matrix.flatpak_arch }}"

      - name: Verify staged mpv runtime
        working-directory: ui
        run: node electron/audio/bins.ts --check build-res/audio

      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          chmod +x quaver-server-${{ matrix.flatpak_arch }}
          mv quaver-server-${{ matrix.flatpak_arch }} quaver-server

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: Build unpacked Electron app
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec electron-builder --linux dir --${{ matrix.electron_arch }} --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/flatpak/electron-builder.yml

      - name: Install Flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.electronjs.Electron2.BaseApp//26.08

      - name: Build Flatpak bundle
        env:
          FLATPAK_ARCH: ${{ matrix.flatpak_arch }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/flatpak-state"
          mkdir -p "$state" release
          flatpak-builder --user --force-clean --state-dir "$state" \
            --repo=flatpak-repo --arch="$FLATPAK_ARCH" \
            flatpak-build packages/flatpak/red.0w0.quaver.yml
          flatpak build-bundle --arch="$FLATPAK_ARCH" flatpak-repo \
            "release/Quaver-${{ steps.version.outputs.version }}-${FLATPAK_ARCH}.flatpak" \
            red._0w0.quaver

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-flatpak-${{ matrix.flatpak_arch }}
          path: release/Quaver-*.flatpak
          if-no-files-found: error

  # 龙芯客户端：Electron 官方 / electron-builder 上游都不支持 loong64 ——
  #   Electron 用 darkyzhou/electron-loong64 社区构建（版本钉在 packages/loong64.yml，
  #   new-world LoongArch64 / glibc >= 2.38 + LSX）；音频引擎 mpv 不随包捆绑：
  #   deb Depends / RPM Requires 声明 mpv + ffmpeg + pipewire。
  #   打包与其它 Linux 架构同一条 electron-builder 流水线，只在本 job 用 pnpm dlx
  #   临时运行 @loongdotjs 分支的 electron-builder / app-builder-lib / builder-util；
  #   deb 配置 extends ARM/x86 的同一份文件（另出一份 loongarch64 的 AOSC 兼容包），
  #   rpm 复用同一组字段（fpm 数组不能跨配置继承）。
  #   运行环境需 ABI 2.0（new world：Debian sid / loongnix / openKylin 等）。
  frontend-linux-loong64:
    name: loong64 deb + rpm
    needs: [verify, sidecar, liino-node, liino-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Sparkle vendor/Liino

      - name: Fetch Liino Node bindings
        uses: actions/download-artifact@v8
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist

      - name: Fetch Liino runtime (loong64)
        uses: actions/download-artifact@v8
        with:
          name: liino-linux-loong64
          path: dist-liino

      - name: Stage bundled Liino runtime
        run: |
          set -euo pipefail
          dest="ui/build-res/liino/linux-loong64"
          mkdir -p "$dest"
          cp -f dist-liino/libliino.so dist-liino/liino.h "$dest/"
          test -s "$dest/libliino.so"

      - name: Fetch sidecar (loong64)
        uses: actions/download-artifact@v8
        with:
          name: sidecar-linux-loong64
          path: dist-bin

      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          chmod +x quaver-server-loong64
          mv quaver-server-loong64 quaver-server

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: Check bundle shape (首屏预算 / 懒加载缝 / 体积上限)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run verify:bundle

      - name: Install fpm backends (rpmbuild / xz)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm xz-utils

      # deb/rpm 不随包音频运行时；extraResources 的 build-res/audio 源缺失时 builder
      # 只记警告并跳过（AppImage 才需要自包含的那份）。
      - name: Drop bundled mpv runtime (distro packages resolve mpv via Depends)
        working-directory: ui
        run: rm -rf build-res/audio

      - name: electron-builder deb/rpm (loong64)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        # 同其它 Linux 档：不给这一步设 GH_TOKEN，避免 builder 自动推导 GitHub publish 配置。
        # electron-builder 上游没有 loong64 目标，这里用 pnpm dlx 把三个核心包临时切到
        # @loongdotjs 分支；项目自身的 lockfile / node_modules 不受影响。
        run: |
          builder() {
            pnpm dlx \
              --package=@loongdotjs/electron-builder@26.15.6 \
              --package=@loongdotjs/app-builder-lib@26.15.6 \
              --package=@loongdotjs/builder-util@26.15.3 \
              electron-builder "$@"
          }
          builder --linux deb --loong64 --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/debian/loong.yml
          builder --linux deb --loong64 --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/debian/loong-aosc.yml
          builder --linux rpm --loong64 --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/rpm/loong.yml

      # 硬口径自检：deb 的 Architecture 同时有 loong64（Debian 系）与 loongarch64（AOSC），
      # rpm=loongarch64；依赖都是
      # mpv + ffmpeg + pipewire；RPM 不能混进 /usr/lib/.build-id（会与其它 Electron 包撞文件）。
      - name: Verify loong64 package metadata
        working-directory: ui
        run: |
          set -euo pipefail

          unpacked=release/linux-loong64-unpacked
          file "$unpacked/red.0w0.quaver" | grep -qi LoongArch
          file "$unpacked/resources/liino/linux-loong64/libliino.so" | grep -qi LoongArch
          # 交叉构建不能把宿主的 x86-64 原生模块带进包；koffi 的 loong64 预编译必须在。
          test ! -e "$unpacked/resources/app.asar.unpacked/node_modules/abstract-socket"
          file "$unpacked/resources/app.asar.unpacked/node_modules/koffi/build/koffi/linux_loong64/koffi.node" \
            | grep -qi LoongArch

          for deb_arch in loong64 loongarch64; do
            deb=$(find release -maxdepth 1 -type f -name "Quaver-*-${deb_arch}.deb" -print -quit)
            [ -n "$deb" ] || { echo "::error::没有生成 ${deb_arch} deb"; exit 1; }
            ctrl=$(dpkg-deb -f "$deb")
            if ! grep -qx 'Depends: mpv, ffmpeg, pipewire' <<< "$ctrl"; then
              echo "::error::${deb_arch} deb 依赖不是 mpv + ffmpeg + pipewire"
              printf '%s\n' "$ctrl"; exit 1
            fi
            if ! grep -qx "Architecture: ${deb_arch}" <<< "$ctrl"; then
              echo "::error::${deb_arch} deb 架构异常"; printf '%s\n' "$ctrl"; exit 1
            fi
          done

          rpm=$(ls release/Quaver-*-loongarch64.rpm)
          [ "$(rpm -qp --queryformat '%{ARCH}' "$rpm")" = 'loongarch64' ]
          req=$(rpm -qp --requires "$rpm" | grep -vE '^(rpmlib\(|/bin/sh$)' | sort | paste -sd, -)
          if [ "$req" != 'ffmpeg,mpv,pipewire' ]; then
            echo "::error::rpm 依赖不是 mpv + ffmpeg + pipewire：$req"; exit 1
          fi
          buildid=$(rpm -qpl "$rpm" | grep -E '^/usr/lib/\.build-id(/|$)' || true)
          if [ -n "$buildid" ]; then
            echo "::error::rpm 里混进了 /usr/lib/.build-id"
            printf '%s\n' "$buildid"
            exit 1
          fi
          echo "OK: loong64 deb/rpm metadata"

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-loong64-deb
          path: ui/release/Quaver-*-loong*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-loong64-rpm
          path: ui/release/Quaver-*-loongarch64.rpm
          if-no-files-found: error

  # Windows：前端全在 x64 runner 上交叉打包（electron-builder 直接支持 arm64 目标）。
  # arm64 的 mpv 在 x64 机器上跑不了 → 随包校验靠暂存脚本里的 PE 机器码核对。
  frontend-windows:
    name: NSIS (${{ matrix.arch_label }})
    needs: [verify, sidecar, liino-node, liino-windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x64
            goarch: amd64
          - arch_label: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      # 版本不在此处钉：读 ui/package.json 的 packageManager（pnpm@10.33.0），
      # 与本地/锁文件的书写版本严格同源，避免「CI 用 latest 10.x」漂移。
      # package_json_file 相对仓库根 —— 本仓库的 package.json 在 ui/ 子目录，根目录没有
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml

      - name: Init submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 vendor/Sparkle vendor/Liino

      - name: Fetch Liino Node bindings
        uses: actions/download-artifact@v8
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist

      - name: Fetch Liino runtime
        uses: actions/download-artifact@v8
        with:
          name: liino-windows-${{ matrix.goarch }}
          path: dist-liino

      # 运行期按 process.platform=win32 解析，不是构建脚本里的 uname —— 目录名必须是 win32-<goarch>
      - name: Stage bundled Liino runtime
        shell: bash
        run: |
          set -euo pipefail
          dest="ui/build-res/liino/win32-${{ matrix.goarch }}"
          mkdir -p "$dest"
          cp -f dist-liino/liino.dll dist-liino/liino.h "$dest/"
          test -s "$dest/liino.dll"

      - name: Fetch sidecar
        uses: actions/download-artifact@v8
        with:
          name: sidecar-windows-${{ matrix.arch_label }}
          path: dist-bin

      # 随包音频运行时（mpv 官方 release）：x64=mingw（自带 DLL）、arm64=msvc（静态链接）。
      # 平铺 mpv.exe 布局，运行期 bins.ts 直接 spawn（见其 win32 分支）。
      - name: Stage bundled mpv runtime
        working-directory: ui
        shell: bash
        run: node scripts/stage-mpv-official.ts win32 ${{ matrix.arch_label }}

      # x64 才能真跑一遍（arm64 载荷在 x64 机器上只会 exec 126，校验在暂存脚本里做 PE 机器码）
      - name: Verify staged mpv runtime
        if: matrix.arch_label == 'x64'
        working-directory: ui
        shell: bash
        run: node electron/audio/bins.ts --check build-res/audio

      - name: pnpm install
        working-directory: ui
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        shell: bash
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: electron-builder NSIS
        working-directory: ui
        shell: bash
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec electron-builder --win nsis --${{ matrix.arch_label }} --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/windows/x86-arm.yml

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-windows-${{ matrix.arch_label }}
          path: ui/release/Quaver-*.exe
          if-no-files-found: error

  # macOS arm64：Electron / sidecar / 随包 mpv 全单架构，无 universal 合并。
  frontend-macos:
    name: dmg (arm64)
    needs: [verify, sidecar, liino-node, liino-macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # 版本不在此处钉：读 ui/package.json 的 packageManager（pnpm@10.33.0），
      # 与本地/锁文件的书写版本严格同源，避免「CI 用 latest 10.x」漂移。
      # package_json_file 相对仓库根 —— 本仓库的 package.json 在 ui/ 子目录，根目录没有
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 vendor/Sparkle vendor/Liino

      - name: Fetch Liino Node bindings
        uses: actions/download-artifact@v8
        with:
          name: liino-node-dist
          path: vendor/Liino/node/dist

      - name: Fetch Liino runtime
        uses: actions/download-artifact@v8
        with:
          name: liino-darwin-arm64
          path: dist-liino

      - name: Stage bundled Liino runtime
        run: |
          set -euo pipefail
          dest="ui/build-res/liino/darwin-arm64"
          mkdir -p "$dest"
          cp -f dist-liino/libliino.dylib dist-liino/liino.h "$dest/"
          test -s "$dest/libliino.dylib"

      - name: Fetch sidecar
        uses: actions/download-artifact@v8
        with:
          name: sidecar-macos-arm64
          path: dist-bin

      - name: Stage sidecar
        working-directory: dist-bin
        run: |
          # artifact 走 zip 不保权限，必须补 exec 位
          chmod +x quaver-server

      # 随包音频运行时（mpv 官方 release，arm64 单架构）：
      # 自包含 mpv.app（自带 dylib rpath），bins.ts 直接 spawn（见其 darwin 分支）
      - name: Stage bundled mpv runtime
        working-directory: ui
        run: node scripts/stage-mpv-official.ts darwin arm64

      - name: Verify staged mpv runtime
        working-directory: ui
        run: |
          set -euo pipefail
          node electron/audio/bins.ts --check build-res/audio

      - name: pnpm install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          nightly: ${{ github.event_name == 'schedule' || inputs.nightly == true }}

      - name: Build dist (tsc + vite)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run build

      - name: electron-builder dmg (arm64)
        working-directory: ui
        env:
          QUAVER_VERSION: ${{ steps.version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # 无证书，跳过签名（identity: null 兜底）
        run: |
          pnpm exec electron-builder --mac dmg --arm64 --publish never \
            --config.extraMetadata.version=${{ steps.version.outputs.version }} \
            --config ../packages/macos/arm64.yml

      # 挂载 dmg 验随包运行时与 sidecar 确实在位（arm 原生跑）
      - name: Verify bundled runtime inside dmg
        working-directory: ui
        run: |
          set -euo pipefail
          dmg=$(ls release/Quaver-*.dmg | head -1)
          mount="$RUNNER_TEMP/dmg-mount"   # hdiutil 的 -mountpoint 要求目录已存在
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true' EXIT
          app=$(ls -d "$mount"/*.app | head -1)
          node electron/audio/bins.ts --check "$app/Contents/Resources/audio"
          [ -x "$app/Contents/Resources/bin/quaver-server" ]
          test -s "$app/Contents/Resources/liino/darwin-arm64/libliino.dylib"

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-macos-arm64
          path: ui/release/Quaver-*.dmg
          if-no-files-found: error

  # ───────────────────────────── Release ─────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend-linux, frontend-linux-flatpak, frontend-windows, frontend-linux-loong64, frontend-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # sidecar 与音频运行时已随 extraResources 打进各平台包，Release 只发客户端本体
      - uses: actions/download-artifact@v8
        with:
          pattern: "quaver-*"
          merge-multiple: true
          path: out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out/
          # -R 显式指定仓库：此 job 无 checkout，gh 靠 git 推断仓库会 fatal
          # -R 之外分两档：
          #   tag 含 beta（不区分大小写）→ --prerelease 直接上线，客户端「Beta 渠道」据此识别；
          #   其余正式 tag              → --draft 只建草稿，人工核对产物/说明后到 Releases 页手动 Publish
          if [[ "$GITHUB_REF_NAME" =~ [Bb][Ee][Tt][Aa] ]]; then
            gh release create "$GITHUB_REF_NAME" \
              -R "$GITHUB_REPOSITORY" \
              --prerelease \
              --generate-notes \
              out/Quaver-*
          else
            gh release create "$GITHUB_REF_NAME" \
              -R "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              out/Quaver-*
          fi

  # ─────────────────────────── 每夜版 Release ───────────────────────────
  # 滚动发布：tag/release 名恒为 nightly，每次构建覆盖上一次（含旧 tag 清理），
  # 产物名里带短 commit id，所以下载下来就知道是哪个 commit 构建的。
  nightly:
    if: github.event_name == 'schedule' || inputs.nightly == true
    needs: [frontend-linux, frontend-linux-flatpak, frontend-windows, frontend-linux-loong64, frontend-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "quaver-*"
          merge-multiple: true
          path: out

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out/
          sha="${GITHUB_SHA:0:7}"
          notes=$(mktemp)
          {
            echo "每夜版自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，对应 commit \`$GITHUB_SHA\`。"
            echo
            echo "包名里的 \`$sha\` 即 commit id。平台覆盖：Linux AppImage/Flatpak（x86_64/aarch64，自包含）、"
            echo "Linux deb/rpm/pacman（x86_64/aarch64，依赖 mpv + ffmpeg + pipewire，走系统音源）、"
            echo "Windows NSIS（x64/arm64）、macOS dmg（arm64）、loong64/loongarch64 deb 与 loongarch64 rpm（同样走系统依赖）。"
            echo
            echo "**非稳定版本**，仅用于验证最新改动。"
          } > "$notes"
          # 昨天那份（release + tag）先删掉；首次跑没有，允许失败
          gh release delete nightly -R "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "no previous nightly release, publishing the first one"
          # -R 显式指定仓库：此 job 无 checkout，gh 靠 git 推断仓库会 fatal
          gh release create nightly \
            -R "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $sha ($(date -u +%Y-%m-%d))" \
            --notes-file "$notes" \
            out/Quaver-*
