# Windows：x64 与 arm64 共用；架构由 CLI --x64/--arm64 决定。
extends: file:../packages/electron-builder-base.yml
win:
  target:
    - nsis
  icon: build-res/icon.png
nsis:
  # assisted（非 oneClick）才会显示安装目录页；oneClick 模式没有这个选项，
  # electron-builder 也会直接拒绝 allowToChangeInstallationDirectory。
  # 应用内更新仍走 /S 静默安装，安装器会从旧 InstallLocation 读回自定义目录。
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
