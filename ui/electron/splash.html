<!doctype html>
<html lang="zh-CN" data-theme="__THEME__">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Quaver Music</title>
    <style>
      /* 启动闪屏：盖在主窗口自身的同窗覆盖层（data: URL 直载，先于后端就绪）。时间线
         （全部 CSS animation，主进程只负责到点加 .closing 淡出后导航到应用）：
           0.10s─0.85s  居中图标淡入 + 轻缩放
           1.00s─1.80s  图标左移到字标旁（位移量 --shift 由脚本实测，字宽随字体变也不歪）
           1.15s─1.70s  「Quaver Music」字标浮现
           1.45s─2.00s  底部「Built by Team Quaver」淡入（钉在窗口底边）
         底色与主窗 backgroundColor / style.css --bg 同源，交接是同一条底色亮起内容。 */
      html[data-theme="dark"]  { --bg:#131417; --ink:#e6e8ec; --ink2:#a6adb8; --glow:rgba(41,184,255,.30); }
      html[data-theme="light"] { --bg:#f7f7f8; --ink:#1f2329; --ink2:#6b7280; --glow:rgba(41,184,255,.22); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { height:100%; }
      body {
        background:var(--bg); color:var(--ink); overflow:hidden; cursor:default;
        font-family:system-ui,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
        -webkit-user-select:none; user-select:none;
        -webkit-app-region:drag; /* CSD 态：闪屏期间整块可拖，手感同主窗抓握点；SSD 态无副作用 */
        transition:opacity .32s ease;
      }
      body.closing { opacity:0; }
      .lockup {
        --shift:0px;
        position:absolute; left:50%; top:46%;
        transform:translate(-50%,-50%);
        display:flex; align-items:center; gap:26px;
        white-space:nowrap;
      }
      .iconwrap { animation:glide .8s cubic-bezier(.66,0,.34,1) 1s both; }
      .ic { display:block; width:128px; height:128px; animation:pop .75s cubic-bezier(.22,.61,.21,1) .1s both; }
      .ic svg { display:block; width:128px; height:128px; filter:drop-shadow(0 18px 40px var(--glow)); }
      .ic:empty { display:none; }
      .word { animation:word-in .55s cubic-bezier(.22,.61,.21,1) 1.15s both; letter-spacing:.01em; }
      .word .q { font-size:44px; font-weight:700; color:var(--ink); }
      .word .m { font-size:44px; font-weight:300; color:var(--ink2); margin-left:12px; }
      .foot {
        position:absolute; left:0; right:0; bottom:36px; text-align:center;
        font-size:13px; letter-spacing:.06em; color:var(--ink2); opacity:.85;
        animation:rise .55s ease 1.45s both;
      }
      /* 未 .go 前动画定住：脚本实测 --shift 的同一拍才放行，杜绝首帧跳位 */
      body:not(.go) .iconwrap, body:not(.go) .ic, body:not(.go) .word, body:not(.go) .foot {
        animation-play-state:paused;
      }
      @keyframes pop {
        from { opacity:0; transform:scale(.86); }
        to   { opacity:1; transform:scale(1); }
      }
      @keyframes glide {
        from { transform:translateX(var(--shift)); }
        to   { transform:translateX(0); }
      }
      @keyframes word-in {
        from { opacity:0; transform:translateX(-12px); }
        to   { opacity:1; transform:translateX(0); }
      }
      @keyframes rise {
        from { opacity:0; transform:translateY(8px); }
        to   { opacity:.85; transform:translateY(0); }
      }
      @keyframes fade { from { opacity:0; } }
      /* 动效敏感用户：去掉位移，只留淡入 */
      @media (prefers-reduced-motion:reduce) {
        .iconwrap { animation:none; transform:none; }
        .ic { animation:fade .6s ease .1s both; }
        .word { animation:fade .6s ease .6s both; transform:none; }
        .foot { animation:fade .6s ease 1s both; }
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <div class="iconwrap"><div class="ic">__ICON__</div></div>
      <div class="word"><span class="q">Quaver</span><span class="m">Music</span></div>
    </div>
    <div class="foot">Built by Team Quaver</div>
    <script>
      // --shift 必须用布局量（offsetWidth，不吃 transform）算：图标在最终 lockup 里偏左
      // (字宽+间距)/2，让它先从「画面正中」出发，动画结束回到布局位，全程不跳。
      (function () {
        var lockup = document.querySelector(".lockup");
        var word = document.querySelector(".word");
        var gap = parseFloat(getComputedStyle(lockup).columnGap) || 26;
        var shift = Math.round((word.offsetWidth + gap) / 2);
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        lockup.style.setProperty("--shift", (reduced ? 0 : shift) + "px");
        requestAnimationFrame(function () { document.body.classList.add("go"); });
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      })();
    </script>
  </body>
</html>
